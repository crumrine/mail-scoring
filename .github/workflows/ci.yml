name: bounded-foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm install --global npm@11.12.1 --ignore-scripts
      - run: node --version && npm --version
      - run: npm ci
      - run: npm run check
      - run: npm run sbom && node scripts/schemas.mjs && git diff --exit-code -- docs/evidence/sbom.json packages/core/schemas
      - run: npm run benchmark
      - run: node scripts/receipt.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: evidence-${{ github.sha }}
          path: .artifacts/
          include-hidden-files: true
          retention-days: 30
